[project]
name = "fileagent-server"
version = "0.1.0"
description = "FileAgent 后端：文档 AI 处理平台（FastAPI + SQLAlchemy + python-docx + PyMuPDF）"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic-settings>=2.15.0",
    "pymupdf>=2.1",
    "psycopg2-binary>=2.9.10",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2",
    "python-pptx>=1.0.2",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv]
# PyMuPDF 2.x 把版面分析（pymupdf-layout → onnxruntime + numpy）和 Markdown 导出
# （pymupdf4llm → networkx + tabulate）做成了**硬依赖**，合计约 73M。
# 我们的 services/pdf.py 只用 `page.get_text("blocks")`，对这些一次都不引用，
# 所以用"永不成立的 marker"把它们从解析结果里摘掉——pymupdf 本体不依赖它们就能跑，
# 实测 import 与全部 PDF 用例都通过。
# ⚠ 真要用版面分析（阶段 5 的表格/图片角色判定）时，删掉这几行即可装回来。
override-dependencies = [
    "pymupdf-layout; python_version < '3.0'",
    "pymupdf_layout; python_version < '3.0'",
    "pymupdf4llm; python_version < '3.0'",
    "onnxruntime; python_version < '3.0'",
    "numpy; python_version < '3.0'",
    "networkx; python_version < '3.0'",
    "tabulate; python_version < '3.0'",
    "psutil; python_version < '3.0'",
]

[tool.pytest.ini_options]
# 让测试能 import 顶层模块（services.* / models.* 等）——server/ 本身在 sys.path 上
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RET", "RUF", "ASYNC", "PIE"]
ignore = [
    # FastAPI 在路由函数默认参数里调用 Depends()/Query()/File() 是框架约定，不是 bug
    "B008",
    # 204 无内容接口里显式 `return None` 表意更清楚，不算多余
    "RET501",
    # 本项目注释/文档/字符串大量使用中文，这些"歧义 Unicode"规则会误报每一个 CJK 字符
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 测试里允许 assert 之外的宽松写法
"tests/*" = ["B011"]
